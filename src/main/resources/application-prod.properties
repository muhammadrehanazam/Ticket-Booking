spring.application.name=Ticket Booking
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://db:3306/ticket_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:ChangeMe123!}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
