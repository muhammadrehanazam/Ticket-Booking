spring.application.name=Ticket Booking
# MySQL Connection
spring.datasource.url=jdbc:mysql://localhost:3306/ticket_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

# Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Database dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD:}

# Security / JWT
jwt.secret=${JWT_SECRET:ticketbooking-secret-key-1234567890}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

# Health / monitoring
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Migration config
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

